<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMİN PANELİ - OY SAYACI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-page">
    <div class="app-container admin-container">
        <header class="admin-header">
            <div>
                <h1>ADMİN KONTROL PANELİ</h1>
                <p>Sistem durumunu ve oyları buradan yönetebilirsiniz.</p>
            </div>
            <a href="index.html" class="btn-cancel" style="padding: 10px 15px; border-radius: 10px; text-decoration: none; font-size: 0.9rem;">
                <i class="fa-solid fa-arrow-left"></i> Sayaca Dön
            </a>
        </header>

        <main>
            <div class="category-card" style="padding: 10px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 15px;">
                    <span style="color: var(--text-secondary); font-weight: 500;">TÜM OYLARI SIFIRLA</span>
                    <button id="btn-reset-all" class="btn-reset">
                        <i class="fa-solid fa-trash-can"></i> SIFIRLA
                    </button>
                </div>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Kategori Adı</th>
                        <th style="width: 100px; text-align: center;">Toplam Oy</th>
                    </tr>
                </thead>
                <tbody id="admin-table-body">
                    <!-- Veriler JS ile gelecek -->
                </tbody>
            </table>
        </main>

        <footer>
            <div class="footer-content">
                <div id="status-badge" style="font-size: 0.8rem; background: rgba(52, 211, 153, 0.1); color: #34d399; padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(52, 211, 153, 0.2);">
                    <i class="fa-solid fa-circle-check"></i> Canlı Bağlantı Aktif
                </div>
                <a href="https://yavuzselimyigit.com" target="_blank" class="signature">by yselimygt</a>
            </div>
        </footer>
    </div>

    <script src="admin.js"></script>
</body>
</html>
